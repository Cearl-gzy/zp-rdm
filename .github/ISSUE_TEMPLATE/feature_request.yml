name: ✨ 功能建议 / Feature Request
description: 提议新功能或改进 / Suggest a feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        中英文均可 / Chinese or English are both fine.
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题 / What problem does this solve
      placeholder: 我在做 … 时，每次都要手动 …
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案 / Proposed solution
      description: 你理想中的交互或命令是什么样 / What would the ideal interaction look like
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案 / Alternatives considered
