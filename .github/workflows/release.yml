name: release

on:
  push:
    tags: ['v*']

# 创建 Release 需要写权限（新仓库默认只读，403 Resource not accessible）
permissions:
  contents: write

jobs:
  # 单元测试 + 真实 Redis 集成测试（miniredis 不支持的 DUMP/RESTORE 在此覆盖）
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        env:
          ZP_RDM_TEST_REDIS_ADDR: localhost:6379
        # 不测根包：main.go embed frontend/dist（CI 上未构建，编译必失败）
        run: go test ./internal/... ./service/...

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify tag matches productVersion
        run: node scripts/verify-version.mjs

      # 更新辅助进程 E2E：假安装器 + 生产同款 CREATE_NO_WINDOW 拉起 PowerShell 辅助脚本，
      # 断言脚本体执行且安装器收到 /S /D=（防 v1.14.1 DETACHED_PROCESS 静默死亡回归）
      - name: Update helper E2E
        shell: bash
        run: |
          E2E_DIR="$RUNNER_TEMP/zp-e2e"
          mkdir -p "$E2E_DIR"
          go build -o "$E2E_DIR/fakeinstaller.exe" ./internal/updatecheck/e2e/fakeinstaller
          go build -o "$E2E_DIR/helpertest.exe" ./internal/updatecheck/e2e/helpertest
          "$E2E_DIR/helpertest.exe" "$E2E_DIR/fakeinstaller.exe"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      # choco 装的 makensis 在 Program Files (x86)\NSIS，不在 runner 会话 PATH 中
      - name: Add makensis to PATH
        run: echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build installer
        run: wails build -nsis -clean

      # wails 找不到 makensis 时只是 warning 不报错，显式校验产物
      - name: Verify installer exists
        shell: pwsh
        run: |
          if (-not (Test-Path build/bin/zp-rdm-amd64-installer.exe)) {
            throw "NSIS 安装包未生成，请检查 makensis 是否在 PATH"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: |
            build/bin/zp-rdm-amd64-installer.exe
            build/bin/zp-rdm.exe
          if-no-files-found: error

  build-darwin:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify tag matches productVersion
        run: node scripts/verify-version.mjs

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      # darwin 编译路径独有代码（如未来 platform-tagged 文件）在 ubuntu 测试覆盖不到
      - name: Run tests on darwin
        run: go test ./internal/... ./service/...

      - name: Build universal app
        run: wails build -platform darwin/universal -clean

      # .app 必须用 ditto 打包以保留资源派生信息；zip 会丢签名/权限位
      - name: Zip app bundle
        run: |
          test -d build/bin/zp-rdm.app || { echo ".app 未生成"; exit 1; }
          ditto -c -k --sequesterRsrc --keepParent build/bin/zp-rdm.app build/bin/zp-rdm-darwin-universal.zip
          ls -l build/bin/zp-rdm-darwin-universal.zip

      - uses: actions/upload-artifact@v4
        with:
          name: dist-darwin
          path: build/bin/zp-rdm-darwin-universal.zip
          if-no-files-found: error

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify tag matches productVersion
        run: node scripts/verify-version.mjs

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      # Wails Linux 构建依赖 GTK3 + WebKit2GTK（ubuntu-latest 24.04 只有 4.1）
      - name: Install native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # webkit2_41 tag：wails 默认找 webkit2gtk-4.0，24.04 无此包，必须用 4.1 绑定
      - name: Build binary
        run: wails build -platform linux/amd64 -clean -tags webkit2_41

      - name: Tar binary
        run: |
          test -x build/bin/zp-rdm || { echo "linux 二进制未生成"; exit 1; }
          tar -czf build/bin/zp-rdm-linux-amd64.tar.gz -C build/bin zp-rdm
          ls -l build/bin/zp-rdm-linux-amd64.tar.gz

      # .deb：nfpm 读取 packaging/nfpm.yaml，VERSION 环境变量注入版本号（自动剥 v 前缀）
      - name: Package .deb
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          nfpm package -f packaging/nfpm.yaml -p deb -t build/bin/
          ls -l build/bin/*.deb
          # 产物名固定，便于 release/latest.json 与更新脚本引用
          mv build/bin/zp-rdm_*_amd64.deb build/bin/zp-rdm-linux-amd64.deb

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: |
            build/bin/zp-rdm-linux-amd64.tar.gz
            build/bin/zp-rdm-linux-amd64.deb
          if-no-files-found: error

  release:
    needs: [build-windows, build-darwin, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      # 更新清单：应用内 CheckUpdate 轮询固定地址 releases/latest/download/latest.json
      # 顶层 url 保留 Windows 安装包地址（老版本客户端兼容），platforms 供多平台选择；
      # sha256 表（与 platforms 同键）供应用内自动下载后校验（v1.13.0 起）
      - name: Generate update manifest
        run: |
          TAG="${{ github.ref_name }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          SHA_WIN="$(sha256sum dist/zp-rdm-amd64-installer.exe | cut -d' ' -f1)"
          SHA_MAC="$(sha256sum dist/zp-rdm-darwin-universal.zip | cut -d' ' -f1)"
          SHA_LINUX="$(sha256sum dist/zp-rdm-linux-amd64.tar.gz | cut -d' ' -f1)"
          cat > dist/latest.json <<EOF
          {
            "version": "${TAG#v}",
            "url": "${BASE}/zp-rdm-amd64-installer.exe",
            "platforms": {
              "windows/amd64": "${BASE}/zp-rdm-amd64-installer.exe",
              "darwin/universal": "${BASE}/zp-rdm-darwin-universal.zip",
              "linux/amd64": "${BASE}/zp-rdm-linux-amd64.tar.gz"
            },
            "sha256": {
              "windows/amd64": "${SHA_WIN}",
              "darwin/universal": "${SHA_MAC}",
              "linux/amd64": "${SHA_LINUX}"
            }
          }
          EOF
          cat dist/latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
