name: release

on:
  push:
    tags: ['v*']

# 创建 Release 需要写权限（新仓库默认只读，403 Resource not accessible）
permissions:
  contents: write

jobs:
  # 单元测试 + 真实 Redis 集成测试（miniredis 不支持的 DUMP/RESTORE 在此覆盖）
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        env:
          ZP_RDM_TEST_REDIS_ADDR: localhost:6379
        # 不测根包：main.go embed frontend/dist（CI 上未构建，编译必失败）
        run: go test ./internal/... ./service/...

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 防呆：tag 必须与 wails.json 中的 productVersion 一致
      - name: Verify tag matches productVersion
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $cfg = Get-Content wails.json -Raw | ConvertFrom-Json
          if ($cfg.info.productVersion -ne $tag) {
            throw "tag $tag != wails.json productVersion $($cfg.info.productVersion)，请先同步版本号"
          }

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      # choco 装的 makensis 在 Program Files (x86)\NSIS，不在 runner 会话 PATH 中
      - name: Add makensis to PATH
        run: echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build installer
        run: wails build -nsis -clean

      # wails 找不到 makensis 时只是 warning 不报错，显式校验产物
      - name: Verify installer exists
        shell: pwsh
        run: |
          if (-not (Test-Path build/bin/zp-rdm-amd64-installer.exe)) {
            throw "NSIS 安装包未生成，请检查 makensis 是否在 PATH"
          }

      # 更新清单：应用内 CheckUpdate 轮询固定地址 releases/latest/download/latest.json
      - name: Generate update manifest
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/zp-rdm-amd64-installer.exe"
          @{ version = $version; url = $url } | ConvertTo-Json | Out-File -Encoding utf8 build/bin/latest.json
          Get-Content build/bin/latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/bin/zp-rdm-amd64-installer.exe
            build/bin/zp-rdm.exe
            build/bin/latest.json
